openapi: 3.0.3
info:
  title: SentinelFlow Fix Filter
  description: >
    Filter high-risk vulnerabilities from scan results and prepare structured
    fix plans for automated code remediation via Bob/Claude Code CLI.
  version: 1.0.0
servers:
  - url: https://arborescent-actorly-carroll.ngrok-free.dev
    description: SentinelFlow (ngrok)

paths:
  /fix/prepare:
    post:
      tags:
        - Fix
      summary: Filter high-risk vulnerabilities and prepare fix plan
      description: >
        Fetches a scan report by scan_id, filters only HIGH and CRITICAL severity
        vulnerabilities, groups them by package (SCA) and issue type (SAST),
        and returns a structured fix plan JSON ready for Bob to execute.
        Use scan_id="latest" to automatically use the most recent scan.
        Set auto_submit=true to automatically send the fix plan to Bob.
      operationId: prepareFix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixPrepareRequest'
            examples:
              latest_scan:
                summary: Use latest scan result
                value:
                  scan_id: "latest"
                  auto_submit: false
              specific_scan:
                summary: Use specific scan ID
                value:
                  scan_id: "scan_20260526_165521_e9b13d"
                  auto_submit: false
      responses:
        '200':
          description: Fix plan prepared successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixPrepareResponse'
        '404':
          description: Scan report not found
      x-ibm-nl-intent-examples:
        - "filter high risk vulnerabilities from the scan"
        - "prepare a fix plan for the latest scan"
        - "show only critical and high severity issues"
        - "what needs to be fixed urgently"
        - "get high risk vulnerability fix list"
        - "列出必要修正的高風險漏洞"
        - "過濾高風險漏洞並整理修復計畫"
        - "只顯示需要立即修正的問題"

  /fix/submit:
    post:
      tags:
        - Fix
      summary: Prepare fix plan and automatically submit to Bob for execution
      description: >
        Same as /fix/prepare but automatically submits the fix plan to Bob
        (code modification agent) for execution. Bob will read the fix plan,
        find the affected files, and apply the code changes.
        Use scan_id="latest" to use the most recent scan result.
      operationId: submitFix
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixPrepareRequest'
            examples:
              submit_latest:
                summary: Auto-fix latest scan results
                value:
                  scan_id: "latest"
                  auto_submit: true
      responses:
        '200':
          description: Fix plan prepared and submitted to Bob
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixPrepareResponse'
        '404':
          description: Scan report not found
      x-ibm-nl-intent-examples:
        - "auto fix all high risk vulnerabilities"
        - "submit fix plan to Bob"
        - "automatically fix the vulnerabilities found in the scan"
        - "fix high severity issues automatically"
        - "send fix request to the code agent"
        - "自動修復高風險漏洞"
        - "幫我修復掃描到的高風險問題"
        - "把修復計畫送給 Bob 執行"
        - "自動修正必要的安全問題"

components:
  schemas:
    FixPrepareRequest:
      type: object
      required:
        - scan_id
      properties:
        scan_id:
          type: string
          description: >
            Scan ID from /scan/start, or "latest" to use the most recent report.
          default: "latest"
          example: "latest"
        auto_submit:
          type: boolean
          description: >
            If true, automatically submit the fix plan to Bob for execution.
            If false (default), only return the fix plan without submitting.
          default: false

    ScaFix:
      type: object
      properties:
        package:
          type: string
          description: Package name
        current_version:
          type: string
          description: Currently installed version
        severity:
          type: string
          description: Highest severity level (critical/high)
        cves:
          type: array
          items:
            type: string
          description: List of CVE IDs affecting this package
        descriptions:
          type: array
          items:
            type: string
          description: CVE descriptions

    SastFix:
      type: object
      properties:
        type:
          type: string
          description: Coverity checker type (e.g. SIGMA.cors_with_credentials_all_origin)
        severity:
          type: string
        cwe:
          type: string
        count:
          type: integer
          description: Number of occurrences
        files:
          type: array
          items:
            type: object
          description: Affected files and line numbers
        fix_guide:
          type: string
          description: How to fix this issue
        auto_fixable:
          type: boolean
          description: Whether Bob can auto-fix this issue type

    FixPrepareResponse:
      type: object
      properties:
        scan_id:
          type: string
        project_name:
          type: string
        generated_at:
          type: string
        original_total:
          type: integer
          description: Total vulnerabilities in original scan
        high_risk_summary:
          type: object
          properties:
            total:
              type: integer
            sast:
              type: integer
            sca:
              type: integer
        sca_fixes:
          type: array
          items:
            $ref: '#/components/schemas/ScaFix'
          description: High-risk SCA packages grouped by package name
        sast_fixes:
          type: array
          items:
            $ref: '#/components/schemas/SastFix'
          description: High-risk SAST issues grouped by type
        requirements_files:
          type: array
          items:
            type: string
          description: All requirements.txt files found in the project
        bob_request:
          type: object
          description: Ready-to-submit fix request body for /code-modification/request
        auto_submitted:
          type: boolean
          description: Whether the fix plan was automatically submitted to Bob
        submission_result:
          type: object
          description: Response from Bob if auto_submitted=true
